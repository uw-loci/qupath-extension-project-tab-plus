# --- Preferences --------------------------------------------------------------------------
prefs.category=Project+
prefs.hideBuiltIn.name=Hide the built-in Project tab
prefs.hideBuiltIn.description=Hide QuPath's own Project tab while Project+ is installed. QuPath keeps using it internally, so nothing breaks; untick to bring it back at once. If the Active Image Helper extension is installed, hiding the tab before that extension has found it removes its menu items from the built-in tab until the next project change after unhiding.
prefs.customHighlight.name=Custom current image highlight
prefs.customHighlight.description=Use the color below instead of the theme tint for the row of the image open in the viewer. Turn it on if you run another extension that colors the built-in tab and want both to match.
prefs.highlightColor.name=Current image highlight color
prefs.highlightColor.description=Color of the tint on the row of the image open in the viewer, in the Project+ tab. Leave it as the theme color unless you run another extension that colors the built-in tab and want both to match. Used only when the custom highlight above is on.
prefs.selectOnStartup.name=Open the Project+ tab on startup
prefs.selectOnStartup.description=Select the Project+ tab when QuPath starts and a project is open. Untick to keep QuPath's own tab selection.

