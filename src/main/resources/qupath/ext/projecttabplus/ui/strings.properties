# Project Tab Plus -- display strings.
#
# Every string here is user-facing JavaFX display text, taken from the Phase 1 UI design
# (02a_ui_design.md sec. 7 and 10) with the Lead's amendments in 02_design.md sec. 1 and 8.
# ASCII only: no arrows, Unicode comparators or emoji anywhere in this file.
#
# Singular and plural are separate complete format strings. Names substitute into a complete
# sentence via %s; nothing is built by concatenating onto a fragment.

name=Project Tab Plus
tab.text=Project+
tab.tooltip=Project images grouped by metadata, with the current image marked and saved-data indicators.

