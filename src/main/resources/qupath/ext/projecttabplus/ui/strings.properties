# --- D1 Remove current image --------------------------------------------------------------
d1.title=Project+ - Remove current image
d1.header=Remove "%s" from the project?
d1.body=The image will be closed first. If it has unsaved changes you will be asked to save or discard them.
d1.dataCheckbox=Move this image's saved data (annotations, detections, TMA grid) to the trash
d1.dataCheckbox.tooltip=Move the project's saved annotations, detections and TMA grid for this image to the trash. The image file is not touched. If left unticked, the folder stays in the project's data directory.
d1.fileCheckbox=Also move the image FILE to the trash
d1.fileCheckbox.tooltip=Move the image file itself to the operating system trash. A second confirmation follows before anything is moved.
d1.fileLine=%s  (%s)
d1.reason.companion=Cannot offer file deletion: this %s image has companion files that QuPath does not list.
d1.reason.shared.one=Cannot offer file deletion: %d other entry in this project uses the same file.
d1.reason.shared.many=Cannot offer file deletion: %d other entries in this project use the same file.
d1.reason.notFound=Cannot offer file deletion: the file was not found.
d1.reason.notLocal=Cannot offer file deletion: the image is not a local file.
d1.reason.multiple=Cannot offer file deletion: the image is spread over several files.
d1.remove=Remove
d1.cancel=Cancel

# --- D2 Move image file to trash ----------------------------------------------------------
d2.title=Project+ - Move image file to trash
d2.header=Move this file to the trash?
d2.details=Size: %s    Modified: %s
d2.body=The file goes to the operating system trash, from where it can be restored. QuPath cannot tell whether another project uses this file.
d2.keep=Keep file
d2.keep.tooltip=Leave the file on disk. The image is still removed from the project.
d2.trash=Move to trash
d2.trash.tooltip=Move the file to the trash. It can be restored from there.

